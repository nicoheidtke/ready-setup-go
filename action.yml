name: Setup Go Better
description: Install Go 1.26+ with a native installer and no runtime downloads of the action itself.
inputs:
  go-version:
    description: Exact Go version or minor selector, such as 1.26.1 or 1.26.x.
    required: true
  check-latest:
    description: Resolve minor selectors against official releases instead of preferring installed patches.
    default: 'false'
outputs:
  go-version:
    description: Selected exact Go version.
    value: ${{ steps.setup.outputs.go-version }}
  goroot:
    description: Selected toolchain directory.
    value: ${{ steps.setup.outputs.goroot }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        SETUP_GO_BETTER_ROOT: ${{ github.action_path }}
        SETUP_GO_BETTER_VERSION: ${{ inputs.go-version }}
        SETUP_GO_BETTER_LATEST: ${{ inputs.check-latest }}
      run: 'source "$SETUP_GO_BETTER_ROOT/launch.sh"'
branding:
  icon: download
  color: blue
