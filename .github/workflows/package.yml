name: Prepare action distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Build all six platforms
        run: go run ./cmd/package --out dist --archives artifacts
      - name: Verify reproducible builds and archives
        shell: bash
        run: |
          go run ./cmd/package --out dist-repro --archives artifacts-repro
          diff -r dist dist-repro
          diff -r artifacts artifacts-repro
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-distribution
          path: |
            artifacts/*
          retention-days: 14
