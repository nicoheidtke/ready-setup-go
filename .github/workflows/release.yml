name: Release action
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version (v1.0.0); empty prepares artifacts only
        type: string
        default: ''
      notes:
        description: Optional reviewed notes; empty generates notes from merged pull requests
        type: string
        default: ''
      publish:
        description: Publish the verified release from main after all preparation gates
        type: boolean
        default: false
      promote:
        description: Mark latest and update major/minor aliases (disable for maintenance releases)
        type: boolean
        default: true
      attest:
        description: Generate GitHub-hosted build provenance for release assets
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: action-distribution-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    if: >-
      github.repository != 'nicoheidtke/setup-go-faster' || (github.actor == 'nicoheidtke' && github.triggering_actor == 'nicoheidtke')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ -n "$RELEASE_TAG" || "$PUBLISH" == true ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test -n "$RELEASE_TAG"
          fi
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate action's Node 24 runtime
        id: node-runtime
        uses: ./.github/actions/node-runtime
      - name: Run all contributor and workflow checks on the action runtime
        shell: bash
        env:
          NODE24: ${{ steps.node-runtime.outputs.path }}
        run: go run ./cmd/check --node "$NODE24" --workflows
      - name: Build all six platforms
        run: go run ./cmd/package --require-clean --out .cache/package/dist --archives .cache/package/artifacts
      - name: Verify reproducible builds and archives
        shell: bash
        run: |
          go run ./cmd/package --require-clean --out .cache/package/dist-repro --archives .cache/package/artifacts-repro
          diff -r .cache/package/dist .cache/package/dist-repro
          diff -r .cache/package/artifacts .cache/package/artifacts-repro
          go run ./cmd/verify-distribution --dist .cache/package/dist --archives .cache/package/artifacts
      - name: Package and verify local lightweight fixture
        run: |
          go run ./cmd/package --require-clean --platform linux/amd64 --out .cache/package/light-dist --archives .cache/package/light-assets --native-download-base https://github.com/nicoheidtke/setup-go-faster/releases/download/local-validation
          go run ./cmd/verify-distribution --platform linux/amd64 --dist .cache/package/light-dist --archives .cache/package/light-assets
      - name: Install isolated fixture toolchain through prepared bundle
        uses: ./.cache/package/dist
        env:
          RUNNER_TOOL_CACHE: ''
          RUNNER_TEMP: ${{ runner.temp }}/package fixture with spaces
        with:
          go-version: '1.27.1'
          cache: off
      - name: Gate preparation on bundled codec and storage lifecycles
        shell: bash
        env:
          SETUP_GO_FASTER_TEST_DIST: ${{ github.workspace }}/.cache/package/dist
          SETUP_GO_FASTER_TEST_RUNNER_TEMP: ${{ runner.temp }}/package fixture with spaces
          SETUP_GO_FASTER_TEST_VERSION: '1.27.1'
          SETUP_GO_FASTER_TEST_NODE: ${{ steps.node-runtime.outputs.path }}
          SETUP_GO_FASTER_TEST_BASH: bash
        run: |
          for compression in gzip zstd none; do
            for storage in archive chunked; do
              SETUP_GO_FASTER_TEST_COMPRESSION="$compression" SETUP_GO_FASTER_TEST_STORAGE="$storage" go test ./internal/cache -run '^TestPackagedLifecycle$' -count=1 -v
            done
          done
          go test ./internal/cache -run '^TestPackagedCancellation$' -count=1 -v
      - name: Gate preparation on verified lightweight bootstrap reuse
        shell: bash
        env:
          SETUP_GO_FASTER_TEST_DIST: ${{ github.workspace }}/.cache/package/light-dist
          SETUP_GO_FASTER_TEST_NATIVE_ASSETS: ${{ github.workspace }}/.cache/package/light-assets
          SETUP_GO_FASTER_TEST_RUNNER_TEMP: ${{ runner.temp }}/package fixture with spaces
          SETUP_GO_FASTER_TEST_VERSION: '1.27.1'
          SETUP_GO_FASTER_TEST_NODE: ${{ steps.node-runtime.outputs.path }}
        run: |
          SETUP_GO_FASTER_TEST_COMPRESSION=zstd SETUP_GO_FASTER_TEST_STORAGE=archive go test ./internal/cache -run '^TestPackagedLifecycle$' -count=1 -v
          SETUP_GO_FASTER_TEST_COMPRESSION=gzip SETUP_GO_FASTER_TEST_STORAGE=chunked go test ./internal/cache -run '^TestPackagedLifecycle$' -count=1 -v
      - name: Prepare release plan and exact Git objects
        if: inputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          PROMOTE: ${{ inputs.promote }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -z "$RELEASE_NOTES" ]]; then
            RELEASE_NOTES=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          fi
          printf '%s\n\nValidation: https://github.com/%s/actions/runs/%s\n' "$RELEASE_NOTES" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > .cache/package/notes.md
          go run ./cmd/release plan --promote="$PROMOTE" --tag "$RELEASE_TAG" --notes .cache/package/notes.md --dist .cache/package/dist --assets .cache/package/artifacts --repro-dist .cache/package/dist-repro --repro-assets .cache/package/artifacts-repro --plan .cache/package/plan.json
          go run ./cmd/release prepare --plan .cache/package/plan.json
          go run ./cmd/release publish --plan .cache/package/plan.json
          git bundle create .cache/package/recovery.bundle refs/heads/main "refs/tags/$RELEASE_TAG"
      - name: Retain release recovery inputs before publication
        if: inputs.tag != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-recovery
          path: |
            .cache/package/plan.json
            .cache/package/notes.md
            .cache/package/recovery.bundle
            .cache/package/dist/**
            .cache/package/artifacts/**
          include-hidden-files: true
          retention-days: 14
      - name: Publish verified release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          go run ./cmd/release publish --execute --plan .cache/package/plan.json
          {
            printf '### Published release\n\n'
            printf '[Release](%s)\n\n' "$(jq -r .published_url .cache/package/plan.json)"
            printf 'Action pin: `nicoheidtke/setup-go-faster@%s`\n' "$(jq -r .distribution .cache/package/plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: action-distribution
          path: |
            .cache/package/artifacts/*
          include-hidden-files: true
          retention-days: 14
  attest:
    if: >-
      (inputs.attest) &&
      (github.repository != 'nicoheidtke/setup-go-faster' || (github.actor == 'nicoheidtke' && github.triggering_actor == 'nicoheidtke'))
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only the opted-in signing job receives OIDC/attestation permissions.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: action-distribution
          path: .cache/attest
      - name: Recheck same-run artifact payloads before signing
        working-directory: .cache/attest
        run: sha256sum -c SHA256SUMS
      - name: Attest prepared artifacts from this run
        id: provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: .cache/attest/*
          create-storage-record: false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: action-attestation
          path: ${{ steps.provenance.outputs.bundle-path }}
          include-hidden-files: true
          retention-days: 14
