name: Manual Exasol Personal validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            workload: build
          - os: ubuntu-24.04
            platform: linux/amd64
            workload: test
          - os: ubuntu-24.04
            platform: linux/amd64
            workload: lint
          - os: windows-2025
            platform: windows/amd64
            workload: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Package installer
        run: go run ./cmd/package --platform '${{ matrix.platform }}'
      - name: Install workload toolchain
        uses: ./dist
        env:
          RUNNER_TOOL_CACHE: ''
          RUNNER_TEMP: ${{ runner.temp }}/workload-toolchain
        with:
          go-version: '1.26.4'
      - name: Test small dependency workload
        working-directory: testdata/packages
        run: go test -mod=readonly -count=1 ./...
      - uses: actions/checkout@v4
        with:
          repository: exasol/exasol-personal
          ref: 54b7e1a7454f49d821102bcab5bfce2c7747f8c6
          path: _workload
          persist-credentials: false
      - name: Isolate workload caches and record inputs
        shell: bash
        run: |
          mkdir -p reports
          echo "GOCACHE=$RUNNER_TEMP/exasol-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/exasol-mod" >> "$GITHUB_ENV"
          git -C _workload rev-parse HEAD > reports/revision.txt
          go version > reports/go-version.txt
      - name: Generate test resources and mocks
        working-directory: _workload
        env:
          GOFLAGS: -tags=containers_image_openpgp
          SKIP_EMBED: 'true'
        run: go generate ./...
      - name: Build Go application with placeholder resources
        if: matrix.workload == 'build'
        working-directory: _workload
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -tags=containers_image_openpgp -trimpath -gcflags=all=-l -o ../reports/exasol-validation ./cmd/exasol
      - name: Run Go unit tests with race detector
        if: matrix.workload == 'test'
        working-directory: _workload
        run: go test -mod=readonly -tags=containers_image_openpgp -race -count=1 -timeout=20m ./...
      - name: Run Go lint
        if: matrix.workload == 'lint'
        working-directory: _workload
        run: go tool golangci-lint run ./...
      - name: Check dependency files are unchanged
        working-directory: _workload
        run: git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exasol-${{ matrix.os }}-${{ matrix.workload }}
          path: reports/*.txt
